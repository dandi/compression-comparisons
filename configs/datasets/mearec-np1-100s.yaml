# Fast-iteration MEArec-NP1 slice — 100 s.
# 100 s × 384 ch × 32 kHz × int16 ≈ 2.3 GB per encode. Fits on a laptop;
# still ~17 min of the paper's 600 s → statistically meaningful sample of
# the 100 GT units without needing to encode the full recording.
loader: mearec
params:
  path: results/dandi-t261-compression-study/sourcedata/aind-ephys-compression/mearec/mearec_NP1.h5
  start_s: 0.0
  duration_s: 100.0

preprocessing:
  # Paper table 1: lsb = 12. The sim driver applies spre.correct_lsb
  # unconditionally (benchmark-lossy-sim.py:147); without it bit-truncation
  # truncates bits that carry no information, so `bittrunc-N` would not be
  # the paper's `bit_truncation-N`.
  - kind: lsb_correction
    lsb: 12
