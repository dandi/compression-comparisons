# Paper reproduction — 10-second slice of one IBL NP1 recording.
# 10s x 30kHz x 384 ch x int16 = 230 MB per encode.
# Small enough that T.261 finishes each cell in ~2 min, while still large
# enough that CR estimates track the paper's full-recording numbers.
#
# Path currently points at a copy of the git-annex partial download; migrate
# to the STAMPED sourcedata subdataset when the full recording is fetched.
loader: aind-benchmark
params:
  # Path resolves relative to the compression-comparisons repo root — the
  # partial-download snapshot lives under results/. When the full recording
  # is fetched via `datalad get` into a STAMPED study's sourcedata subdataset,
  # point at that path instead (see DEPLOY.md for the production layout).
  path: results/scratch-real-ephys-CSHZAD026-partial
  start_s: 0.0
  duration_s: 10.0
