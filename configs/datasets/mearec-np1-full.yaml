# MEArec-simulated NP1 dataset — 600 s, 100 GT units, 10 µV noise.
# The paper's ground-truth substrate for lossy-compression spike-sorting-fidelity
# evaluation (Buccino et al. §3.2.2, Figs 10-11).
#
# Requires: datalad -C sourcedata/aind-ephys-compression get mearec/mearec_NP1.h5
# (~19 GB annexed).
loader: mearec
params:
  path: results/dandi-t261-compression-study/sourcedata/aind-ephys-compression/mearec/mearec_NP1.h5

preprocessing:
  # Paper table 1: lsb = 12. The sim driver applies spre.correct_lsb
  # unconditionally (benchmark-lossy-sim.py:147); without it bit-truncation
  # truncates bits that carry no information, so `bittrunc-N` would not be
  # the paper's `bit_truncation-N`.
  - kind: lsb_correction
    lsb: 12
