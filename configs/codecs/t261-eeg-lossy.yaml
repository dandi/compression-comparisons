# T.261 lossy — EEG independent-channel preset, stock tuning.
# Corresponds to `combinedPresetEEG_IndepChannel.cfg` (StepSizeForQP=1.001,
# tools enabled: BlockMatching, TrafoSignalAdapt=0, TrafoDiffs=0, ...).
# Distortion is fixed by the preset; the paper's WavPack-Hybrid bps sweep
# analogue is in the `t261-eeg-lossy-qp*.yaml` variants.
codec: t261
params:
  preset: combinedPresetEEG_IndepChannel
  bit_depth: 16
