# Paper reproduction gate — Buccino et al. 2023 Fig 2/6 (raw) and Fig 7
# (pre-processing) across all 8 Neuropixels 1.0 recordings, plus T.261.
#
# MEASUREMENT CONDITIONS (plan §4.6b) — this profile reproduces the paper's
# conditions, which earlier profiles did not:
#   (a) LSB correction, as a NEW AXIS alongside the uncorrected data.
#   (b) 1 s chunks — the paper compresses through a Zarr store with
#       (chunk_samples, n_channels) chunks and every headline figure
#       filters to 1 s. Whole-buffer is swept alongside for continuity
#       with our earlier derivatives.
#   (c) all three blosc shuffle options.
#
# NOTHING IS DISCARDED (plan §6 decision 6): the uncorrected,
# whole-buffer condition our earlier sweeps measured is still swept and
# still reported. LSB correction and chunking are added conditions, not
# replacements — the original AIND numbers are an absolute.
#
# WHY 8 RECORDINGS, 60 s: the Phase 1 gate (plan §5) is a median-of-8
# against the paper's published median-of-8, so it needs breadth across
# recordings, not length within one.
#
# Cell count: 8 recordings x 4 preprocessing x
#   (18 paper codecs x 2 chunkings + 6 T.261 configs x 1 chunking)
#   = 8 x 4 x 42 = 1344 cells.
#
# RUN FROM THE STAMPED STUDY ROOT:
#   cd results/dandi-t261-compression-study
#   snakemake -s ../../src/compbench/pipeline/Snakefile \
#       --configfile ../../configs/profiles/paper-real-np1-8.yaml \
#       --config results_dir=derivatives/compbench-$(date -I)-np1-8-slice60s \
#       --cores 21 --keep-going

name: paper-real-np1-8

# Whole-buffer (our historical condition) AND the paper's 1 s chunk.
chunk_durations_s: [null, 1.0]

datasets_matrix:
  loader: aind-benchmark
  params:
    start_s: 0.0
    duration_s: 60.0

  recordings:
    # `vars.lsb` is the recording's least-significant bit, from the paper's
    # table 1. SpikeGLX (IBL) writes raw ADC values → LSB 1. Open Ephys
    # (AIND) rescales to a fixed 0.195 uV/sample → LSB 12 for NP1, 3 for
    # NP2. It is referenced as ${lsb} by the lsb_correction steps below.
    #
    # --- IBL NP1 (SpikeGLX, LSB 1) --------------------------------------
    - label: ibl-CSHZAD026
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/CSHZAD026_2020-09-04_probe00}
    - label: ibl-CSHZAD029
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/CSHZAD029_2020-09-09_probe00}
    - label: ibl-SWC054-probe00
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/SWC054_2020-10-05_probe00}
    - label: ibl-SWC054-probe01
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/SWC054_2020-10-05_probe01}
    # --- AIND NP1 (Open Ephys, LSB 12) ----------------------------------
    - label: aind-625749
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/625749_2022-08-03_15-15-06_ProbeA}
    - label: aind-634568
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634568_2022-08-05_15-59-46_ProbeA}
    - label: aind-634569
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634569_2022-08-09_16-14-38_ProbeA}
    - label: aind-634571
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634571_2022-08-04_14-27-05_ProbeA}

  preprocessing:
    # FOUR conditions, not two. LSB correction is an added axis, never a
    # retrofit — plan §6 decision 6. The uncorrected AIND numbers are a
    # legitimate, permanent result (what a naive consumer of the AIND
    # bucket actually gets) and are never discarded or superseded.
    #
    # `raw` + `bp`  : data exactly as the benchmark bucket ships it.
    # `lsb` + `lsbbp`: the paper's measurement condition, AIND only.
    # IBL recordings have lsb=1, for which `correct_lsb` is documented to
    # apply no operation, so those two conditions are skipped there rather
    # than duplicating `raw`/`bp` under another name. For IBL, `raw` IS the
    # paper's condition.
    - label: raw
    - label: bp
      steps:
        - kind: bandpass
          low_hz: 300
          high_hz: 6000
          order: 4
    - label: lsb
      # Skipped for SpikeGLX recordings: lsb=1 makes `correct_lsb` a no-op,
      # so this condition would be a byte-identical duplicate of `raw`.
      # The paper's own driver marks ibl-np1 as {"none": False}.
      skip_when_vars: {lsb: 1}
      steps:
        - kind: lsb_correction
          lsb: "${lsb}"
    - label: lsbbp
      skip_when_vars: {lsb: 1}   # would duplicate `bp` — see above
      steps:
        - kind: lsb_correction
          lsb: "${lsb}"
        - kind: bandpass
          low_hz: 300
          high_hz: 6000
          order: 4

codecs:
  # --- blosc family: level x shuffle ------------------------------------
  # All three shuffle options: the paper's best general-purpose config is
  # blosc-zstd at high level with BIT shuffling, and LZMA with NO shuffling
  # for NP1 (plan §4.6b(c)). Sweeping only `byte` — as earlier profiles did
  # — never measured the paper's best configuration.
  - {codec: blosc-lz4,   params: {level: 9, shuffle: none}}
  - {codec: blosc-lz4,   params: {level: 9, shuffle: byte}}
  - {codec: blosc-lz4,   params: {level: 9, shuffle: bit}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: none}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: byte}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: bit}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: none}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: byte}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: bit}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: none}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: byte}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: bit}}   # paper's best Zarr config

  # --- standard codecs used directly ------------------------------------
  - {codec: gzip,        params: {level: 5}}
  - {codec: zlib,        params: {level: 5}}
  - {codec: lz4,         params: {acceleration: 1}}
  - {codec: zstd,        params: {level: 3}}
  - {codec: zstd,        params: {level: 22}}
  - {codec: lzma,        params: {preset: 6}}

  # --- T.261 / H.BWC lossless -------------------------------------------
  # NOTE: `combinedPresetEEG_lossless` (joint-channel) is deliberately
  # ABSENT — it exceeds the 30-minute cell timeout on 384 ch x 10 s and
  # extrapolates to 60+ h at full length ([R5-C2] in plan §Phase 3.5).
  # T.261 stays whole-buffer: it is not in the paper, so it needs no 1 s
  # comparability, and the subprocess adapter would spawn one BWC process
  # per second of recording.
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel_lossless}}

  # --- T.261 / H.BWC lossy QP sweep -------------------------------------
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 1.5}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 2.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 3.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 5.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 8.0}}
