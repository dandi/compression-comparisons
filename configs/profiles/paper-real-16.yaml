# Full paper matrix — all 16 Neuropixels recordings (8 NP1 + 8 NP2) at the
# paper's own full recording length, under the paper's measurement
# conditions (plan §4.6b), extended with T.261.
#
# THIS IS THE EXPENSIVE ONE. Run `paper-real-np1-8.yaml` first: it clears
# the Phase 1 median-of-8 gate in hours, and if the ranking is wrong you
# want to know that before spending days here.
#
# Same four preprocessing conditions and the same chunking policy as the
# gate profile — including the UNCORRECTED conditions, which are a
# permanent result in their own right and are never discarded
# (plan §6 decision 6).
#
# Cost, extrapolated from measured 10 s cells on a 32-core / 1 TB host:
# T.261 lossy alone is ~13-19 h per cell. Budget days, run under
# `--keep-going`, and cap `--cores` near 12-16 on a 1 TB box (~60 GB per
# concurrent full-length cell after the [R5-H2]/[R5-C1] blocking fixes).
#
# `duration_s` is deliberately absent: the loader then reads each
# recording in full, which is the paper's setting. Durations range from
# 732 s to 2430 s — see paper-cited-numbers.yaml.
#
# RUN FROM THE STAMPED STUDY ROOT — see paper-real-np1-8.yaml.

name: paper-real-16

# Paper's 1 s chunk only — see paper §3.1.2; whole-buffer buys <1%.
chunk_durations_s: [1.0]

datasets_matrix:
  loader: aind-benchmark
  params:
    start_s: 0.0

  recordings:
    # `vars.lsb` from the paper's table 1 — see paper-cited-numbers.yaml.
    # A mismatch is caught by tests/unit/test_paper_cited_numbers.py.
    # --- NP1 (8) — the paper's Fig 2/6/7 set -----------------------
    - label: ibl-CSHZAD026
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/CSHZAD026_2020-09-04_probe00}
    - label: ibl-CSHZAD029
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/CSHZAD029_2020-09-09_probe00}
    - label: ibl-SWC054-probe00
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/SWC054_2020-10-05_probe00}
    - label: ibl-SWC054-probe01
      vars: {lsb: 1}
      params: {path: sourcedata/aind-ephys-compression/ibl-np1/SWC054_2020-10-05_probe01}
    - label: aind-625749
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/625749_2022-08-03_15-15-06_ProbeA}
    - label: aind-634568
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634568_2022-08-05_15-59-46_ProbeA}
    - label: aind-634569
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634569_2022-08-09_16-14-38_ProbeA}
    - label: aind-634571
      vars: {lsb: 12}
      params: {path: sourcedata/aind-ephys-compression/aind-np1/634571_2022-08-04_14-27-05_ProbeA}
    # --- NP2 (8) ---------------------------------------------------
    - label: aind-np2-595262-0221
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/595262_2022-02-21_15-18-07_ProbeA}
    - label: aind-np2-602454-0322
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/602454_2022-03-22_16-30-03_ProbeB}
    - label: aind-np2-612962-0413
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/612962_2022-04-13_19-18-04_ProbeB}
    - label: aind-np2-612962-0414
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/612962_2022-04-14_17-17-10_ProbeC}
    - label: aind-np2-618197-0621
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/618197_2022-06-21_14-08-06_ProbeC}
    - label: aind-np2-618318-0413
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/618318_2022-04-13_14-59-07_ProbeB}
    - label: aind-np2-618384-0414
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/618384_2022-04-14_15-11-00_ProbeB}
    - label: aind-np2-621362-0714
      vars: {lsb: 3}
      params: {path: sourcedata/aind-ephys-compression/aind-np2/621362_2022-07-14_11-19-36_ProbeA}

  preprocessing:
    # FOUR conditions, not two. LSB correction is an added axis, never a
    # retrofit — plan §6 decision 6. The uncorrected AIND numbers are a
    # legitimate, permanent result (what a naive consumer of the AIND
    # bucket actually gets) and are never discarded or superseded.
    #
    # `raw` + `bp`  : data exactly as the benchmark bucket ships it.
    # `lsb` + `lsbbp`: the paper's measurement condition, AIND only.
    # IBL recordings have lsb=1, for which `correct_lsb` is documented to
    # apply no operation, so those two conditions are skipped there rather
    # than duplicating `raw`/`bp` under another name. For IBL, `raw` IS the
    # paper's condition.
    - label: raw
    - label: bp
      steps:
        - kind: bandpass
          low_hz: 300
          high_hz: 6000
          order: 4
    - label: lsb
      # Skipped for SpikeGLX recordings: lsb=1 makes `correct_lsb` a no-op,
      # so this condition would be a byte-identical duplicate of `raw`.
      # The paper's own driver marks ibl-np1 as {"none": False}.
      skip_when_vars: {lsb: 1}
      steps:
        - kind: lsb_correction
          lsb: "${lsb}"
    - label: lsbbp
      skip_when_vars: {lsb: 1}   # would duplicate `bp` — see above
      steps:
        - kind: lsb_correction
          lsb: "${lsb}"
        - kind: bandpass
          low_hz: 300
          high_hz: 6000
          order: 4

codecs:
  # ==========================================================================
  # CONDITIONS FOLLOW THE PAPER'S DRIVER (benchmark-lossless.py), verified
  # cell-by-cell against its own per-recording results:
  #   levels   blosc {1,5,9}  zstd {1,11,22}  lzma/zlib/gzip {1,5,9}
  #            lz4 {9,5,1} INVERTED  flac {1,5,8}  wavpack {1,2,3}
  #   shuffle  blosc: {no, bit, byte} (internal)
  #            non-blosc: {no, byte} via numcodecs.Shuffle(2) as a Zarr FILTER
  #   headline `high` for general-purpose, `medium` for audio
  # ==========================================================================

  # --- blosc family: high level x all three internal shuffles -------------
  - {codec: blosc-lz4,   params: {level: 9, shuffle: none}}
  - {codec: blosc-lz4,   params: {level: 9, shuffle: byte}}
  - {codec: blosc-lz4,   params: {level: 9, shuffle: bit}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: none}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: byte}}
  - {codec: blosc-lz4hc, params: {level: 9, shuffle: bit}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: none}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: byte}}
  - {codec: blosc-zlib,  params: {level: 9, shuffle: bit}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: none}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: byte}}
  - {codec: blosc-zstd,  params: {level: 9, shuffle: bit}}   # paper's best Zarr config

  # --- non-blosc codecs: BOTH shuffle options ----------------------------
  # Previously swept `no` only, which made 5 of 9 general-purpose codecs
  # half-conditioned and put the paper's headline NP2 LZMA cell (byte,
  # CR 1.91) out of reach entirely.
  - {codec: gzip,        params: {level: 9, shuffle: no}}
  - {codec: gzip,        params: {level: 9, shuffle: byte}}
  - {codec: zlib,        params: {level: 9, shuffle: no}}
  - {codec: zlib,        params: {level: 9, shuffle: byte}}
  - {codec: lz4,         params: {acceleration: 1, shuffle: no}}    # `high`, inverted
  - {codec: lz4,         params: {acceleration: 1, shuffle: byte}}
  - {codec: zstd,        params: {level: 22, shuffle: no}}
  - {codec: zstd,        params: {level: 22, shuffle: byte}}
  - {codec: lzma,        params: {preset: 9, shuffle: no}}          # paper's best NP1
  - {codec: lzma,        params: {preset: 9, shuffle: byte}}        # paper's best NP2

  # --- audio codecs: the paper's winners ---------------------------------
  # `medium` is the level the paper selected for Fig 6, having found `high`
  # buys almost no CR for a sharp loss of speed.
  #
  # FLAC CAVEAT: the paper compresses FLAC in 2-channel Zarr chunks
  # (`channel_chunk_size=2`), worth ~22% CR — NP1 3.58 vs 2.94 at the
  # default. `flac_numcodecs.Flac` takes no channel argument (Zarr chunking,
  # not a codec parameter) and we chunk only along time, so these cells map
  # to the paper's ccs=-1 rows: NP1 2.940, NP2 2.016. Compare against those.
  - {codec: flac,        params: {level: 5}}
  - {codec: wavpack,     params: {level: 2}}                 # lossless

  # --- WavPack Hybrid: the paper's lossy baseline ------------------------
  # The curve T.261's QP sweep is measured against (paper Fig 10-14).
  # NOTE: wavpack-numcodecs 0.2.3 changed the hybrid flag from `=` to `|=`,
  # so at a given bps we emit a different bitstream than the paper's 0.1.3.
  # Recorded per-cell; see codecs/audio.py.
  - {codec: wavpack,     params: {level: 2, bps: 6.0}}
  - {codec: wavpack,     params: {level: 2, bps: 5.0}}
  - {codec: wavpack,     params: {level: 2, bps: 4.0}}
  - {codec: wavpack,     params: {level: 2, bps: 3.5}}
  - {codec: wavpack,     params: {level: 2, bps: 3.0}}
  - {codec: wavpack,     params: {level: 2, bps: 2.5}}
  - {codec: wavpack,     params: {level: 2, bps: 2.25}}

  # --- delta filters (paper Fig 7a/c) ------------------------------------
  # Swept on the four codecs the paper sweeps them on. A time delta is a
  # headline result: NP1 blosc-zstd 2.79 -> 3.24. Whole-buffer excluded —
  # these exist purely for the Fig-7 comparison, which is at 1 s.
  - {codec: blosc-zstd, chunk_durations_s: [1.0], params: {level: 9, shuffle: bit, delta: 1d}}
  - {codec: blosc-zstd, chunk_durations_s: [1.0], params: {level: 9, shuffle: bit, delta: 2d-time}}
  - {codec: blosc-zstd, chunk_durations_s: [1.0], params: {level: 9, shuffle: bit, delta: 2d-space}}
  - {codec: blosc-zstd, chunk_durations_s: [1.0], params: {level: 9, shuffle: bit, delta: 2d-time-space}}
  - {codec: lzma, chunk_durations_s: [1.0], params: {preset: 9, shuffle: no, delta: 2d-time}}
  - {codec: flac, chunk_durations_s: [1.0], params: {level: 5, delta: 2d-time}}
  - {codec: wavpack, chunk_durations_s: [1.0], params: {level: 2, delta: 2d-time}}

  # --- T.261 / H.BWC lossless -------------------------------------------
  # `combinedPresetEEG_lossless` (joint-channel) is deliberately ABSENT — it
  # exceeds the 30-minute cell timeout at 384 ch x 10 s ([R5-C2]).
  #
  # T.261 stays whole-buffer: not in the paper, so no 1 s comparability is
  # needed, and the subprocess adapter would spawn one BWC process per
  # second of recording.
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel_lossless}}

  # --- T.261 / H.BWC lossy QP sweep -------------------------------------
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 1.5}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 2.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 3.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 5.0}}
  - {codec: t261, chunk_durations_s: [null], params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 8.0}}
