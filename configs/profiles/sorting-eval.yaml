# Sorting-fidelity evaluation on MEArec-simulated NP1 (paper §3.2.2 Fig 10-14).
#
# STATUS: profile skeleton. The sorting-metric pipeline stage
# (`compbench sort` / `compbench compare-sorting`) is not implemented yet —
# tracked as Phase 3.5 [R1-H3] in the plan. Once implemented, this profile
# will:
#   1. For each (dataset, codec, params): run `compbench run` (encode/decode).
#   2. For each cell: sort the reconstructed traces with Kilosort2.5.
#   3. Compare each sort against MEArec ground-truth via
#      `spikeinterface.comparison.GroundTruthComparison`.
#   4. Report per-cell: accuracy/precision/recall distributions, unit-count
#      classifications (well_detected / false_positive / redundant /
#      overmerged), waveform-feature errors.
#
# Runs on `compbench-ks25` container image (Kilosort 2.5 to match paper).
#
# Estimated wall on a 32-core CUDA box: ~4-6 h per T.261 QP point × 100 s
# MEArec input (encode ~10 min + sort ~15 min + compare ~1 min per cell).
# The full sweep below (24 cells) → ~2-3 days on one node, or ~4 h on 8 nodes.

name: sorting-eval
datasets:
  # Start with 100 s slice for iteration; full 600 s once pipeline verified.
  - configs/datasets/mearec-np1-100s.yaml

codecs:
  # Lossless baseline (paper Fig 10 uses the lossless output as the reference
  # for its "excess spikes" analysis).
  - {codec: blosc-zstd, params: {level: 9, shuffle: byte}}

  # T.261 IndepChannel lossless (should match blosc-zstd on sorting metrics).
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel_lossless}}

  # T.261 lossy QP sweep — this is what the paper's Fig 10 shows for
  # WavPack-Hybrid bps. We report accuracy/precision/recall vs QP.
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 1.5}}
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 2.0}}
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 3.0}}
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 5.0}}
  - {codec: t261, params: {preset: combinedPresetEEG_IndepChannel, step_size_for_qp: 8.0}}

  # WavPack-Hybrid baseline for direct T.261-vs-paper-winner comparison
  # (requires `.[audio]` extra; paper reports bps 6, 5, 4, 3.5, 3, 2.5, 2.25).
  - {codec: wavpack, params: {level: 2}}
  - {codec: wavpack, params: {level: 2, bps: 6.0}}
  - {codec: wavpack, params: {level: 2, bps: 4.0}}
  - {codec: wavpack, params: {level: 2, bps: 3.0}}
  - {codec: wavpack, params: {level: 2, bps: 2.5}}
  - {codec: wavpack, params: {level: 2, bps: 2.25}}

  # (Optional) bit-truncation reference to compare against paper Fig 10 for
  # NP1 (paper: 3-4 bits truncation ≈ WavPack-Hybrid bps 2.25 in CR terms).
  # numcodecs.FixedScaleOffset + blosc-zstd — not yet registered as a codec
  # in compbench; add as a follow-up.
