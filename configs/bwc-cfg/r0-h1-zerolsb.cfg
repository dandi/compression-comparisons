# Rung-0 candidate: r0-h1-zerolsb
# Derived from combinedPresetEEG_IndepChannel.cfg
StepSizeForQP               : 1.001  # Step size to derive base QP from; allowed to be fractional (see also https://iphome.hhi.de/schwarz/assets/dc/10-OptScalarQuant.pdf)

# MaxAbsDeltaQP               : 0      # Defines the delta-QP range to be tested during encoding of each block   # dropped: let the encoder auto-configure

# LOG2_MAX_BLOCK_SIZE         : 10     # If not specified: auto-config (10 at StepSizeForQP < 1.5, 8 otherwise)   # dropped: let the encoder auto-configure
# MAX_SPLIT_DEPTH             : 0      # If not specified: auto-config (3 at StepSizeForQP < 1.5, 2 otherwise)   # dropped: let the encoder auto-configure
MIN_SPLIT_DEPTH_FULL_TEST   : 0      # If not specigied: auto-config (0 by default)
IntraPeriod                 : 98304  # Intra period (96*1024). 0 means infinity
ChannelGroupSize            : 1      # 0: All channels are encoded in one channe group (default), 1: Each channel is encoded in a separate channel group


##### Tools signalled in bitstream
UseBlockMatching            : 1 # 1: On (default), 0: Off
UseLinearModel              : 1 # 1: On (default), 0: Off
UseTrafoSignalAdapt         : 0 # 1: On (default), 0: Off
UseBMOffsetPredPrevCh       : 1 # 1: On (default), 0: Off
UsePrevChSignalAdapt        : 0 # 1: On (default), 0: Off
UseBMSigFiltering           : 1 # 2: full-sample and half-sample filter (default), 1: half-sample filter, 0: Off
UseBMSigMultiHyp            : 1 # 1: On (default), 0: Off
UseLMSigFiltering           : 0 # 2: full-sample and half-sample filter (default), 1: half-sample filter, 0: Off
UseLMSigMultiHyp            : 1 # 1: On (default), 0: Off
PerceptMode                 : 0 # 0: Off (default), >0: deblocking, other perceptual optimization
QuantMode                   : 1 # 0: Uniform reconstruction quantizer, 1: TCQ4 (default), 2: TCQ8

##### Tools encoder only
UseNoPred                   : 1 # 1: On (default), 0: Off # needs to be turned on in case of lossless coding
# UsePredDC                   : 0 # 1: On (default), 0: Off
# UsePredLF                   : 0 # 1: On (default), 0: Off
UseTrafoDiffs               : 0 # 1: On (default), 0: Off
UseTrafoSlope               : 0 # 1: On (default), 0: Off
UseTrafoHalfSlope           : 0 # 1: On (default), 0: Off
TrellisQuantDelay           : 0 # 0: Off (default), >0: delayed decision with corresponding delay
NumOptionsSignalAdapt       : 0 # 1-8 options (default 8)
AllowBlockMerge             : 0 # 1: On (default), 0: Off
UseRDOQ                     : 1 # 1: On (default), 0: Off
UseMultHypPreSearchBM       : 0 # 1: On (default), 0: Off
UseMultHypPreSearchLM       : 0 # 1: On (default), 0: Off
BMNumCandsFullRD            : 2 # must be >=1 (default 5)
LMNumCandsFullRD            : 3 # must be >=1 (default 4)
UseCombinedUniBiBM          : 1 # 1: On , 0: Off (default)
UseFastL1DecisionNoDCLFPred : 1 # 1: On , 0: Off (default)
MaxNumMinus1PrevChSigAd     : 6 # from 0 to 31 (default 2)
###########

ChannelDistortionScaleFactor     : 0.0  # Scaling of disortion by the channel variances. 1.0 is full scaling, 0.0 is no scaling. Values inbetween are possible.
InputFileLength                  : -1   # File length to be signalled in the AM_NUT. Used as InputLength if InputLength is not specified. Set to -1 to auto-detect the size from the input-file.

EdfInputFiltering                : ignoreC_LAB>-< # Ignores empty channels in the CHBMIT dataset. It has no effect for the MIT and Ozdemir dataset

####### additional cfg params #######

cgps_ctx_init_flag               : 0 # 1: On, 0: Off (default)

cgps_allow_DC_pred_flag                     : 0 # 1: On (default), 0: Off
cgps_allow_line_fit_flag                    : 0 # 1: On (default), 0: Off
cgps_allow_sample_pred_fixed_weights_flag   : 1 # 1: On (default), 0: Off

cgps_allow_transform_skip                   : 0 # 0: always DCT (if coeffs present), 1: DCT optionally per block
cgps_allow_verbatim_coding                  : 0    
cgps_allow_zero_lsb_flag    : 1      # free arm
cgps_allow_lms_flag                         : 1
cgps_allow_lms_split_flag                   : 0
cgps_allow_cc_lms_flag                      : 1
cgps_max_order_cc_lms_minus_one             : 31
LMS_ORDER                                   : 16
