WpsId               : 0            # indicates WPS ID for feature insertion
ChannelGroupId      : 0            # indicates channel group id where feature has to be inserted
FeatureStart        : 125000       # indicates the start of a feature marking in milliseconds
FeatureLength       : 28000        # indicates the length of a feature marking in milliseconds starting from ft_feature_start
SamplingRate        : 360          # indicates sampling frequency of channel group `cgpsID` in Hz
AnnotationStr       : TestStr      # indicates a certain type of features of the signal
AnnotationChannelId : 1 # indicates channel id(To be passed only if feature type is AnnotationWaveformParameterSetId)
