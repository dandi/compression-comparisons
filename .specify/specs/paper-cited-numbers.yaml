# Numbers transcribed from Buccino et al. 2023 for the Phase 1 gate (plan §5).
#
# Source: the published open-access article, NOT the Code Ocean data asset.
#   Buccino A P, Winter O, Bryant D, Feng D, Svoboda K, Siegle J H (2023)
#   "Compression strategies for large-scale electrophysiology data"
#   J. Neural Eng. 20 056009.  DOI 10.1088/1741-2552/acf5a4  (CC-BY 4.0)
# Every value below is quoted verbatim from the article's Results text;
# `quote:` carries the sentence it came from so a reader can check it
# without refetching. Nothing here is inferred or read off a figure.
#
# STATISTIC: median +/- SD, N = 8 recordings per probe type.
# The capsule's notebook (code/lossless.ipynb, cells 26/55/65/79) computes
# `.median().round(2)` and `.std().round(2)`. Earlier drafts of our plan
# said the paper reported a MEAN — it does not. Our median-of-8 is
# therefore directly comparable without correction.
#
# MEASUREMENT CONDITIONS these numbers were produced under (plan §4.6b) —
# a comparison is only valid against our cells run the same way:
#   - LSB correction ON        (capsule query `lsb != 'false'`)
#   - chunk duration 1 s       (capsule query `chunk_duration == '1s'`)
#   - Zarr compression level "high" for general-purpose codecs,
#     "medium" for the audio codecs (FLAC / WavPack)
#   - shuffle as noted per codec below
#   - FLAC only: channel_chunk_size = 2 (capsule cell 51). FLAC compresses
#     channel PAIRS; at the default -1 (all channels) its NP1 CR is 2.94,
#     not 3.58 — a 22% difference, so this condition is not optional.
#     WavPack uses -1.
#
# VERIFIED 2026-08-20 against the capsule's actual `benchmark-lossless.csv`,
# now available locally (see `src/capsule-ephys-compression-results/`). All
# eight values below reproduce exactly, including the two LZMA figures that
# were back-computed from file-size percentages. The verification also
# surfaced the FLAC channel_chunk_size=2 condition noted above, which the
# article's prose does not state.
#
# The full per-condition table derived from that CSV is
# `.specify/specs/paper-reference-lossless.csv` (source data is CC0 1.0),
# regenerated by `scripts/extract_paper_reference.py`. That table is the
# machine-readable reference for automatic diffing and carries per-condition
# median/std/min/max/n; this YAML remains the human-readable, quotable
# record of what the published article actually says.

meta:
  doi: 10.1088/1741-2552/acf5a4
  license: CC-BY-4.0
  # WHICH CAPSULE VERSION the derived reference table came from. The Code
  # Ocean capsule has two published versions and they correspond to two
  # different manuscripts:
  #   v1 — 2023-05-22 11:33 — the bioRxiv preprint
  #   v2 — 2023-08-30 16:42 — the published J. Neural Eng. article
  # Everything transcribed and derived here is from **v2**, matching the
  # published article these numbers are quoted from. If v1 is later added
  # to the vendored history, diff the two before assuming a number moved
  # for any reason other than the revision.
  capsule_version: v2
  capsule_version_date: 2023-08-30T16:42
  capsule_id: 3822095
  statistic: median_plus_minus_sd
  n_per_distribution: 8
  # Fig 2 pools levels AND shuffles (N = 72 per blosc codec, 48 per
  # numcodecs codec); Fig 6 is single-config. Never compare a pooled median
  # against a single-config one -- the mismatch alone is worth 10-17%.
  transcribed_utc: 2026-08-20
  conditions:
    lsb_correction: true
    chunk_duration_s: 1.0
    level_general_purpose: high
    level_audio: medium

# ---------------------------------------------------------------------
# Figure 6 — best general-purpose vs audio codecs, NO preprocessing.
# This is the comparison our `raw` (well: `lsb`) condition maps onto.
# ---------------------------------------------------------------------
lossless_raw:
  - codec: wavpack
    level: medium
    probe: NP1
    cr: 3.59
    sd: 0.12
    file_size_percent: 27.9
    quote: >-
      Audio codecs clearly outperform general-purpose codecs in terms of CR,
      with WavPack achieving a CR of 3.59 ± 0.12 for NP1 (file size ∼27.9%)
      and 2.26 ± 0.13 for NP2 (file size ∼44.2%).
  - codec: wavpack
    level: medium
    probe: NP2
    cr: 2.26
    sd: 0.13
    file_size_percent: 44.2
    quote: >-
      ... and 2.26 ± 0.13 for NP2 (file size ∼44.2%).
  - codec: flac
    level: medium
    channel_chunk_size: 2   # required condition — see header
    probe: NP1
    cr: 3.58
    sd: 0.13
    quote: >-
      The CR of FLAC is almost identical to WavPack (NP1: 3.58 ± 0.13;
      NP2: 2.27 ± 0.12)
  - codec: flac
    level: medium
    channel_chunk_size: 2   # required condition — see header
    probe: NP2
    cr: 2.27
    sd: 0.12
    quote: >-
      The CR of FLAC is almost identical to WavPack (NP1: 3.58 ± 0.13;
      NP2: 2.27 ± 0.12)
  - codec: blosc-zstd
    level: high
    shuffle: bit
    probe: NP1
    cr: 2.79
    sd: 0.33
    file_size_percent: 35.8
    quote: >-
      With a time delta filter, CR for blosc-zstd increases from 2.79 ± 0.33
      to 3.24 ± 0.09 for NP1 and from 1.9 ± 0.06 to 2.13 ± 0.12 for NP2
  - codec: blosc-zstd
    level: high
    shuffle: bit
    probe: NP2
    cr: 1.90
    sd: 0.06
    file_size_percent: 52.63
    quote: >-
      ... and from 1.9 ± 0.06 to 2.13 ± 0.12 for NP2

# Derived, not quoted: the article gives LZMA only as a file-size percentage.
# 1/0.354 = 2.82 (NP1), 1/0.524 = 1.91 (NP2). Flagged `derived: true` so a
# consumer can choose to exclude them from a strict comparison.
lossless_raw_derived:
  - codec: lzma
    level: high
    shuffle: none      # paper: "no shuffling for NP1"
    probe: NP1
    cr: 2.82
    derived: true
    from_file_size_percent: 35.4
    quote: >-
      Compared to the Zarr-based codecs, one can then expect around an 8%
      reduction in file size when using audio compression for both probe
      types (NP1 - blosc-zstd: ∼35.8%, LZMA: ∼35.4%; NP2 - blosc-zstd:
      ∼52.63%, LZMA: ∼52.4%).
  - codec: lzma
    level: high
    shuffle: byte      # paper Fig 6 caption says bit for NP2; capsule cell 43 says byte
    probe: NP2
    cr: 1.91
    derived: true
    from_file_size_percent: 52.4
    note: >-
      SETTLED 2026-08-20 by the vendored CSV: byte shuffle, median CR
      1.910, matching the 52.4% file size exactly. The paper's §3.1.5 prose
      says byte too; only the Fig 6 caption says bit. Table 2 lists lzma as
      (no, byte) only, so bit was never an option.

# ---------------------------------------------------------------------
# Figure 7(b)/(d) — preprocessing. Our `bp` / `lsbbp` condition maps here.
# The paper's band is 0.3-6 kHz, matching our bandpass(300-6000, order 4).
# ---------------------------------------------------------------------
lossless_bandpass_300_6000:
  - codec: wavpack
    level: medium
    probe: NP1
    cr: 5.28
    sd: 0.20
    quote: >-
      For WavPack, for example, the CR goes from 3.59 ± 0.12 for NP1 and
      2.27 ± 0.13 for NP2 when no pre-processing is applied, to 5.28 ± 0.2
      for NP1 and 3.85 ± 0.22 for NP2 after band-pass filtering.
  - codec: wavpack
    level: medium
    probe: NP2
    cr: 3.85
    sd: 0.22
    quote: >-
      ... to 5.28 ± 0.2 for NP1 and 3.85 ± 0.22 for NP2 after band-pass
      filtering.

# ---------------------------------------------------------------------
# Figure 2 POOLED medians -- levels x shuffles, N = 72 (blosc) / 48
# (numcodecs). These, not the Fig 6 single-config numbers, are the right
# target for any pooled comparison. Quoted verbatim in paper §3.1.4 and
# reproduced exactly from benchmark-lossless.csv.
# ---------------------------------------------------------------------
lossless_raw_pooled:
  - {codec: lzma,       probe: NP1, cr: 2.52, sd: 0.31, n: 48, pooled_over: [level, shuffle]}
  - {codec: blosc-zstd, probe: NP1, cr: 2.38, sd: 0.36, n: 72, pooled_over: [level, shuffle]}
  - {codec: lzma,       probe: NP2, cr: 1.85, sd: 0.07, n: 48, pooled_over: [level, shuffle]}
  - {codec: blosc-zstd, probe: NP2, cr: 1.76, sd: 0.15, n: 72, pooled_over: [level, shuffle]}
  # NOTE: the paper's NP2 SDs do not reproduce exactly from the capsule
  # data (computed 0.10 and 0.18 vs the quoted 0.07 and 0.15); the medians
  # match exactly. Do not use these SDs as gate tolerances.

# ---------------------------------------------------------------------
# FLAC at channel_chunk_size = -1 -- the condition we can actually
# produce. Our FLAC cells map HERE, not to the ccs=2 headline above.
# ---------------------------------------------------------------------
lossless_raw_flac_ccs_default:
  - {codec: flac, level: medium, channel_chunk_size: -1, probe: NP1, cr: 2.940}
  - {codec: flac, level: medium, channel_chunk_size: -1, probe: NP2, cr: 2.016}

# ---------------------------------------------------------------------
# Band-pass 300-6000 (Fig 7b/d) -- targets for our `bp` / `lsbbp` arms,
# which previously had none for the general-purpose codecs.
# Median +/- SD over 8, LSB-corrected, 1 s chunks.
# ---------------------------------------------------------------------
lossless_bandpass_reference:
  - {codec: blosc-zstd, shuffle: bit,  probe: NP1, cr: 3.375, sd: 0.176}
  - {codec: lzma,       shuffle: byte, probe: NP1, cr: 3.037, sd: 0.151}
  - {codec: flac,       channel_chunk_size: 2, probe: NP1, cr: 5.292, sd: 0.178}
  - {codec: wavpack,    probe: NP1, cr: 5.282, sd: 0.202}
  - {codec: blosc-zstd, shuffle: bit,  probe: NP2, cr: 2.254, sd: 0.129}
  - {codec: lzma,       shuffle: byte, probe: NP2, cr: 2.179, sd: 0.130}
  - {codec: flac,       channel_chunk_size: 2, probe: NP2, cr: 3.992, sd: 0.208}
  - {codec: wavpack,    probe: NP2, cr: 3.853, sd: 0.220}

# ---------------------------------------------------------------------
# Delta filters (Fig 7a/c) -- median CR over 8, same conditions.
# `1d` is numcodecs.Delta on the FLATTENED chunk, which is why it HURTS.
# ---------------------------------------------------------------------
lossless_delta_reference:
  - {codec: blosc-zstd, probe: NP1, delta: "no",            cr: 2.79}
  - {codec: blosc-zstd, probe: NP1, delta: "1d",            cr: 2.71}
  - {codec: blosc-zstd, probe: NP1, delta: "2d-time",       cr: 3.24}
  - {codec: blosc-zstd, probe: NP1, delta: "2d-space",      cr: 2.71}
  - {codec: blosc-zstd, probe: NP1, delta: "2d-time-space", cr: 3.10}
  - {codec: wavpack,    probe: NP1, delta: "no",            cr: 3.59}
  - {codec: wavpack,    probe: NP1, delta: "1d",            cr: 2.93}
  - {codec: wavpack,    probe: NP1, delta: "2d-time",       cr: 3.57}
  - {codec: blosc-zstd, probe: NP2, delta: "no",            cr: 1.90}
  - {codec: blosc-zstd, probe: NP2, delta: "2d-time",       cr: 2.13}

# ---------------------------------------------------------------------
# Non-blosc byte shuffle (paper table 2) -- the axis we could not express
# until 2026-08-20. Median CR over 8, level=high, LSB-corrected, 1 s.
# ---------------------------------------------------------------------
lossless_shuffle_reference:
  - {codec: gzip, probe: NP1, shuffle: byte, cr: 2.361}
  - {codec: gzip, probe: NP1, shuffle: "no", cr: 2.180}
  - {codec: lzma, probe: NP1, shuffle: byte, cr: 2.568}
  - {codec: lzma, probe: NP1, shuffle: "no", cr: 2.815}   # paper's best NP1
  - {codec: zstd, probe: NP1, shuffle: byte, cr: 2.464}
  - {codec: zstd, probe: NP1, shuffle: "no", cr: 2.542}
  - {codec: lz4,  probe: NP2, shuffle: byte, cr: 1.554}
  - {codec: lz4,  probe: NP2, shuffle: "no", cr: 1.000}   # 1.55x -- the largest shuffle effect
  - {codec: lzma, probe: NP2, shuffle: byte, cr: 1.910}   # paper's best NP2
  - {codec: lzma, probe: NP2, shuffle: "no", cr: 1.842}

# ---------------------------------------------------------------------
# Headline claims we should be able to reproduce qualitatively.
# ---------------------------------------------------------------------
claims:
  - id: audio-beats-general-purpose
    text: >-
      For lossless compression, audio codecs (FLAC and WavPack) achieve
      compression ratios (CRs) 6% higher for NP1 and 10% higher for NP2
      than the best general-purpose codecs, at the expense of decompression
      speed.
    note: >-
      NOT REPRODUCIBLE AT FACE VALUE. As a CR ratio the paper's own data
      gives +27% for NP1 (3.59/2.82) and +18% for NP2 (2.26/1.91). The
      6%/10% figures are file-size PERCENTAGE-POINT statements
      (35.4% -> 27.9%), and they appear swapped between probes relative to
      the delta-filtered comparison they match. Do not gate on 6%/10%.
  - id: codec-ranking
    text: >-
      Lossless CR ordering, derived from benchmark-lossless.csv under the
      capsule's headline filter (lsb != 'false', chunk_duration == '1s').
      NP1: lzma > blosc-zstd > zstd > gzip ~ zlib > blosc-zlib >
      blosc-lz4hc > blosc-lz4 > lz4.
      NP2: lzma > blosc-zstd > zstd > blosc-lz4hc > gzip ~ zlib >
      blosc-zlib > blosc-lz4 > lz4.
    corroborating_quote: >-
      LZMA produces the highest average CR, immediately followed by zstd,
      whose blosc implementation (blosc-zstd) appears to outperform the
      numcodecs version (zstd).
    corrected: 2026-08-20
    note: >-
      CORRECTED. The ordering previously recorded here (lzma > zstd L22 >
      blosc-zstd > blosc-zlib > gzip ~ zlib > ...) had two inversions --
      zstd above blosc-zstd, and blosc-zlib above gzip/zlib -- and was in
      fact our own byte-shuffle-only result mislabelled as the paper's.
      Ordering is condition-dependent; compare only at matching conditions.
  - id: lossy-wavpack-hybrid
    text: >-
      WavPack Hybrid is superior to naive bit truncation, achieving a CR of
      around 7 (~14% file size) for both probe types without affecting
      spike sorting results or altering spike waveforms.
    note: >-
      The T.261 lossy Pareto is measured against this. Needs Phase 3b (GPU).

