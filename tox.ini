[tox]
envlist = py3{11,12,13},lint,type
requires =
    tox>=4.11
    tox-uv>=1.11
isolated_build = true

[testenv]
description = Unit tests
extras = test
commands = pytest {posargs:tests/unit -v}

[testenv:integration]
description = End-to-end tests (require `duct` and `compbench` on PATH)
extras = test
commands = pytest {posargs:tests/integration -v}

[testenv:lint]
description = ruff check + format-check
skip_install = true
deps =
    ruff>=0.4
commands =
    ruff check src/compbench tests
    ruff format --check src/compbench tests

[testenv:type]
description = mypy strict on src/compbench
extras = devel
commands = mypy src/compbench

[testenv:cov]
description = Coverage report
extras = test
commands =
    pytest --cov=compbench --cov-report=term-missing --cov-report=xml \
        {posargs:tests/}

[gh-actions]
python =
    3.11: py311, lint, type
    3.12: py312, cov, integration
    3.13: py313
